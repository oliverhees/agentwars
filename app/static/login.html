<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Boardroom · Anmelden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0F12;--panel:#16181D;--panel2:#1B1E24;--line:#262932;
  --text:#E9E7E2;--muted:#8B8F98;--accent:#F97216;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;
  display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:26px;width:100%;max-width:380px}
h1{font-family:"IBM Plex Mono",monospace;font-size:15px;
  letter-spacing:.1em;margin-bottom:6px}
h1 b{color:var(--accent);font-weight:600}
p{color:var(--muted);font-size:13px;margin-bottom:18px}
label{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
input{width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;color:var(--text);font:inherit;padding:10px 12px;
  outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;height:44px;margin-top:16px;border:none;
  border-radius:var(--radius);background:var(--accent);color:#0E0F12;
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;
  cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);
  outline-offset:2px}
.err{color:#E06060;font-size:12.5px;margin-top:10px;min-height:16px}
</style>
</head>
<body>
<form class="card" id="form">
  <h1>BOARD<b>ROOM</b></h1>
  <p>Der Raum ist verschlossen. Passwort, bitte.</p>
  <label for="pw">PASSWORT</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button id="go" type="submit">ANMELDEN</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
const $ = id => document.getElementById(id);
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("err").textContent = "";
  $("go").disabled = true;
  try{
    const res = await fetch("/api/login", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ password: $("pw").value })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Anmeldung fehlgeschlagen");
    location.replace("/");
  }catch(err){
    $("err").textContent = err.message;
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
