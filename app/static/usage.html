<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Boardroom · Verbrauch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0F12;--panel:#16181D;--panel2:#1B1E24;--line:#262932;
  --text:#E9E7E2;--muted:#8B8F98;--accent:#F97216;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;
  line-height:1.55;min-height:100vh}
.mono,td.num,th.num{font-family:"IBM Plex Mono",monospace}

header{display:flex;align-items:center;gap:16px;padding:10px 16px;
  border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:5;flex-wrap:wrap}
.wordmark{font-family:"IBM Plex Mono",monospace;font-weight:600;
  letter-spacing:.14em;font-size:13px}
.wordmark b{color:var(--accent)}
header a{color:var(--muted);text-decoration:none;font-size:12px;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.06em}
header a:hover{color:var(--text)}
header select{background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;color:var(--text);font:inherit;font-size:13px;
  padding:6px 10px;margin-left:auto;max-width:320px}

main{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
h2{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;
  color:var(--muted);margin:28px 0 10px;font-weight:500;text-transform:uppercase}
h2:first-child{margin-top:0}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px}
.kpi .label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.kpi .value{font-family:"IBM Plex Mono",monospace;font-size:25px;
  font-weight:600;margin-top:6px;letter-spacing:-.02em}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.money .value{color:var(--accent)}

table{width:100%;border-collapse:collapse;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);
  font-size:13.5px}
th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.1em;color:var(--muted);text-transform:uppercase;
  font-weight:500;background:var(--panel2)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-size:13px}
.wrap{overflow-x:auto;border-radius:12px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:5px;
  overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-right:7px;vertical-align:1px}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;
  color:var(--muted);margin-left:6px}
.hint{color:var(--muted);font-size:12.5px;margin-top:10px}
.hint.warn{color:#E5A445}
.empty{background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:26px;text-align:center;color:var(--muted)}
@media (max-width:640px){header select{margin-left:0;width:100%}}
</style>
</head>
<body>

<header>
  <div class="wordmark">BOARD<b>ROOM</b></div>
  <a href="/">← BOARD</a>
  <a href="/settings">EINSTELLUNGEN</a>
  <select id="project" aria-label="Projekt"></select>
</header>

<main id="main"><div class="empty">Lade …</div></main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const nf = new Intl.NumberFormat("de-DE");
const money = v => new Intl.NumberFormat("de-DE",
  {style:"currency", currency:"EUR", maximumFractionDigits: v < 1 ? 4 : 2}).format(v);
const tok = n => n >= 1_000_000 ? (n/1_000_000).toFixed(2) + " M"
              : n >= 1000 ? (n/1000).toFixed(1) + " k" : nf.format(n || 0);

let state = {};

function kpis(t){
  const gesamt = (t.input_tokens||0) + (t.output_tokens||0);
  return `<div class="kpis">
    <div class="kpi money">
      <div class="label">Kosten (Rechnung)</div>
      <div class="value">${money(t.billed_eur||0)}</div>
      <div class="sub">API-Modelle · ${(t.billed_usd||0).toFixed(4)} USD</div>
    </div>
    <div class="kpi">
      <div class="label">Im Abo enthalten</div>
      <div class="value">${money(t.included_eur||0)}</div>
      <div class="sub">Claude Code – Gegenwert, keine Rechnung</div>
    </div>
    <div class="kpi">
      <div class="label">Tokens gesamt</div>
      <div class="value">${tok(gesamt)}</div>
      <div class="sub">${tok(t.input_tokens)} rein · ${tok(t.output_tokens)} raus</div>
    </div>
    <div class="kpi">
      <div class="label">Aufrufe</div>
      <div class="value">${nf.format(t.calls||0)}</div>
      <div class="sub">${tok(t.cache_read||0)} Token aus dem Cache</div>
    </div>
  </div>`;
}

function tabelle(titel, zeilen, spalte, label){
  if (!zeilen.length) return "";
  const max = Math.max(...zeilen.map(z => (z.billed_usd||0) + (z.included_usd||0)), 0.0000001);
  return `<h2>${esc(titel)}</h2><div class="wrap"><table>
    <thead><tr>
      <th>${esc(label)}</th><th class="num">Rein</th><th class="num">Raus</th>
      <th class="num">Aufrufe</th><th class="num">Kosten</th>
    </tr></thead><tbody>
    ${zeilen.map(z => {
      const summe = (z.billed_usd||0) + (z.included_usd||0);
      const abo = (z.included_usd||0) > 0 && (z.billed_usd||0) === 0;
      return `<tr>
        <td>${spalte(z)}${z.has_estimates ? '<span class="tag">geschätzt</span>' : ""}${abo ? '<span class="tag">Abo</span>' : ""}
          <div class="bar"><span style="width:${(summe/max*100).toFixed(1)}%"></span></div></td>
        <td class="num">${tok(z.input_tokens)}</td>
        <td class="num">${tok(z.output_tokens)}</td>
        <td class="num">${nf.format(z.calls||0)}</td>
        <td class="num">${money(abo ? z.included_eur : z.billed_eur)}</td>
      </tr>`;
    }).join("")}
    </tbody></table></div>`;
}

function meetingsTabelle(zeilen){
  if (!zeilen.length) return "";
  return `<h2>Meetings</h2><div class="wrap"><table>
    <thead><tr><th>Gestartet</th><th>Briefing</th><th>Status</th>
      <th class="num">Tokens</th><th class="num">Kosten</th></tr></thead><tbody>
    ${zeilen.map(m => `<tr>
      <td class="mono">${new Date(m.started_at*1000).toLocaleString("de-DE")}</td>
      <td>${esc((m.briefing||"").slice(0,70))}${(m.briefing||"").length > 70 ? "…" : ""}</td>
      <td>${esc(m.status)}</td>
      <td class="num">${tok((m.input_tokens||0)+(m.output_tokens||0))}</td>
      <td class="num">${money((m.billed_usd||0) ? m.billed_usd*state.rate : m.included_usd*state.rate)}</td>
    </tr>`).join("")}
    </tbody></table></div>`;
}

function render(d){
  state.rate = (d.total.billed_usd || 0) > 0
    ? (d.total.billed_eur / d.total.billed_usd) : 0.92;
  if (!d.total.calls){
    $("main").innerHTML = `<div class="empty">Noch kein Verbrauch erfasst.<br>
      Nach dem ersten Board-Meeting steht hier, wer wie viel verbraucht hat.</div>`;
    return;
  }
  const farbe = z => `<span class="dot" style="background:${
    esc((state.colors||{})[z.agent_id] || "#888")}"></span>`;

  const ohnePreis = d.by_model.filter(m =>
    (m.billed_usd||0) === 0 && (m.included_usd||0) === 0 && m.output_tokens > 0);

  $("main").innerHTML = kpis(d.total)
    + tabelle("Je Agent", d.by_agent, z => farbe(z) + esc(z.agent_name || z.agent_id), "Agent")
    + tabelle("Je Modell", d.by_model, z => esc(z.model) + `<span class="tag">${esc(z.provider)}</span>`, "Modell")
    + tabelle("Je Phase", d.by_phase, z => esc(z.phase || "—"), "Phase")
    + (d.project_id ? meetingsTabelle(d.meetings)
                    : tabelle("Je Projekt", d.by_project, z => esc(z.name), "Projekt"))
    + (ohnePreis.length
        ? `<div class="hint warn">Ohne hinterlegten Preis, deshalb 0 €:
           ${ohnePreis.map(m => esc(m.model)).join(", ")}. Trag sie unter
           <a href="/settings" style="color:inherit">Einstellungen → Kosten</a> ein.</div>`
        : "")
    + `<div class="hint">„Geschätzt" heißt: der Anbieter hat keine Tokenzahlen
       mitgeliefert, sie wurden über den Tokenizer berechnet. Claude Code
       rechnet selbst ab – exakt, aber über deine Subscription bezahlt.</div>`;
}

async function laden(){
  const id = $("project").value;
  const res = await fetch("/api/usage" + (id ? "?project_id=" + encodeURIComponent(id) : ""));
  if (res.status === 401){ location.href = "/"; return; }
  const d = await res.json();
  if (!$("project").options.length){
    $("project").innerHTML = '<option value="">Alle Projekte</option>'
      + d.projects.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  }
  render(d);
}

// Agentenfarben fürs Wiedererkennen aus dem Chat holen.
fetch("/api/team").then(r => r.ok ? r.json() : {agents:[]}).then(t => {
  state.colors = Object.fromEntries((t.agents||[]).map(a => [a.id, a.color]));
  return laden();
}).catch(() => laden());

$("project").onchange = laden;
</script>
</body>
</html>
