<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AgentWars · KI-Agentur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#0E0F12; --panel:#16181D; --panel2:#1B1E24; --line:#262932;
  --text:#E9E7E2; --muted:#8B8F98; --accent:#F97216;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:15px; line-height:1.55;
  display:flex; flex-direction:column; overflow:hidden;
}
.mono{font-family:"IBM Plex Mono",monospace}

/* ---------- Topbar: Wordmark + Agenda ---------- */
header{
  display:flex; align-items:center; gap:20px;
  padding:10px 16px; border-bottom:1px solid var(--line);
  background:var(--panel); flex-wrap:wrap;
}
.wordmark{font-family:"IBM Plex Mono",monospace; font-weight:600;
  letter-spacing:.14em; font-size:13px; white-space:nowrap}
.wordmark b{color:var(--accent); font-weight:600}
.agenda{display:flex; gap:4px 14px; flex-wrap:wrap; align-items:center}
.settings-link{margin-left:auto; color:var(--muted); text-decoration:none;
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em;
  white-space:nowrap}
.settings-link:hover{color:var(--accent)}
.agenda-item{font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  color:var(--muted); display:flex; align-items:center; gap:6px;
  letter-spacing:.04em; white-space:nowrap}
.agenda-item .tick{width:7px; height:7px; border-radius:50%;
  background:var(--line); flex:none}
.agenda-item.active{color:var(--text)}
.agenda-item.active .tick{background:var(--accent);
  animation:pulse 1.4s ease-in-out infinite}
.agenda-item.done{color:var(--muted); text-decoration:line-through;
  text-decoration-color:var(--accent); text-decoration-thickness:1px}
.agenda-item.done .tick{background:var(--accent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){
  .agenda-item.active .tick,.dot.typing{animation:none}}

/* ---------- Layout ---------- */
main{flex:1; display:flex; min-height:0}
.rail{
  width:210px; flex:none; border-right:1px solid var(--line);
  background:var(--panel); padding:14px 12px; overflow-y:auto;
}
.rail h2{font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  color:var(--muted); letter-spacing:.16em; margin-bottom:12px;
  font-weight:500}
.member{display:flex; align-items:center; gap:10px; padding:7px 6px;
  border-radius:8px}
.member .dot{width:9px; height:9px; border-radius:50%; flex:none;
  opacity:.45; transition:opacity .2s}
.member .dot.typing{opacity:1; animation:pulse 1s ease-in-out infinite;
  box-shadow:0 0 8px currentColor}
.member .who{min-width:0}
.member .name{font-family:"IBM Plex Mono",monospace; font-size:12.5px;
  font-weight:600}
.member .tag{font-size:11px; color:var(--muted); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}

/* ---------- Chat ---------- */
.chat-wrap{flex:1; display:flex; flex-direction:column; min-width:0}
#chat{flex:1; overflow-y:auto; padding:18px 18px 8px;
  scroll-behavior:smooth}
.msg{max-width:860px; margin:0 auto 14px}
.msg .head{display:flex; align-items:baseline; gap:8px; margin-bottom:3px}
.msg .head .name{font-family:"IBM Plex Mono",monospace; font-size:12px;
  font-weight:600}
.msg .head .role{font-size:11px; color:var(--muted)}
.msg .body{background:var(--panel); border:1px solid var(--line);
  border-left:2px solid var(--agent,#555);
  border-radius:var(--radius); padding:10px 14px;
  overflow-wrap:break-word}
.msg .body :is(h1,h2,h3,h4){font-size:14px; margin:10px 0 4px;
  font-weight:600}
.msg .body p{margin:6px 0}
.msg .body ul,.msg .body ol{margin:6px 0 6px 18px}
.msg .body li{margin:2px 0}
.msg .body code{font-family:"IBM Plex Mono",monospace; font-size:12.5px;
  background:var(--panel2); padding:1px 5px; border-radius:4px}
.msg .body pre{background:var(--panel2); border:1px solid var(--line);
  border-radius:8px; padding:10px; overflow-x:auto; margin:8px 0}
.msg .body pre code{background:none; padding:0}
.mention{font-family:"IBM Plex Mono",monospace; font-size:.92em;
  font-weight:600; padding:0 4px; border-radius:5px;
  background:color-mix(in srgb, var(--m,#888) 18%, transparent);
  color:var(--m,#aaa)}
.member{cursor:pointer}
.member:hover{background:var(--panel2)}
.msg.me .body{border-left-color:var(--accent); background:var(--panel2)}
.msg.me .head .name{color:var(--accent)}
.sys{max-width:860px; margin:0 auto 14px; text-align:center;
  font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  color:var(--muted)}
.sys.plane{color:var(--accent)}
.sys.tool{opacity:.75}
.sys.warn{color:#E5A445}
.caret{display:inline-block; width:7px; height:14px;
  background:var(--agent,#888); vertical-align:-2px; margin-left:2px;
  animation:pulse .8s steps(2) infinite}

/* ---------- Ansicht folgt der Phase ----------
   Sechs gleichzeitig geschriebene Gutachten sind kein Gespräch. Sie stehen
   deshalb als Spalten nebeneinander, die Diskussion bleibt Chat, die
   Synthese wird ein Dokument. */
.section{max-width:100%; margin:0 auto 18px}
.section-label{margin:0 0 8px;
  font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  letter-spacing:.16em; color:var(--muted); display:flex;
  align-items:center; gap:10px}
.section-label::after{content:""; flex:1; height:1px; background:var(--line)}
/* auto-fit statt fester Spaltenzahl: sechs Beiträge passen auf einen
   breiten Schirm nebeneinander, auf einem schmalen brechen sie um –
   seitwärts scrollen muss niemand. */
.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:12px; align-items:start}
.col{background:var(--panel); border:1px solid var(--line);
  border-top:2px solid var(--agent,#555); border-radius:var(--radius);
  display:flex; flex-direction:column; max-height:min(62vh, 620px);
  min-width:0}
.col > .head{display:flex; align-items:baseline; gap:8px; flex:none;
  padding:8px 12px; border-bottom:1px solid var(--line);
  background:var(--panel); border-radius:var(--radius) var(--radius) 0 0}
.col > .head .name{font-family:"IBM Plex Mono",monospace; font-size:12px;
  font-weight:600}
.col > .head .role{font-size:11px; color:var(--muted); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.col > .stack{overflow-y:auto; padding:10px 12px; overscroll-behavior:contain}
.col .msg{max-width:none; margin:0 0 8px}
.col .msg .body{background:none; border:none; border-left:none;
  border-radius:0; padding:0; font-size:14px}
.col .sys{margin:4px 0; text-align:left; font-size:11px}
.docs{max-width:900px; margin:0 auto}
.doc{background:var(--panel); border:1px solid var(--line);
  border-top:2px solid var(--agent,var(--accent)); border-radius:var(--radius);
  padding:18px 22px}
.doc > .head{display:flex; align-items:baseline; gap:8px;
  padding-bottom:10px; margin-bottom:12px; border-bottom:1px solid var(--line)}
.doc > .head .name{font-family:"IBM Plex Mono",monospace; font-size:12px;
  font-weight:600}
.doc > .head .role{font-size:11px; color:var(--muted)}
.doc .msg{max-width:none; margin:0}
.doc .msg .body{background:none; border:none; border-radius:0; padding:0;
  font-size:15.5px; line-height:1.68}
.doc .msg .body :is(h1,h2,h3,h4){font-size:16px; margin:18px 0 6px}
.doc .msg .body :first-child{margin-top:0}

/* ---------- Composer ---------- */
.composer{border-top:1px solid var(--line); background:var(--panel);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.composer-inner{max-width:860px; margin:0 auto; display:flex; gap:8px}
.composer textarea{flex:1; resize:none; background:var(--panel2);
  border:1px solid var(--line); border-radius:var(--radius);
  color:var(--text); font:inherit; padding:9px 12px; height:44px;
  outline:none}
.composer textarea:focus{border-color:var(--accent)}
button{font-family:"IBM Plex Mono",monospace; font-weight:600;
  font-size:13px; border:none; border-radius:var(--radius);
  background:var(--accent); color:#0E0F12; padding:0 18px;
  cursor:pointer}
button:disabled{opacity:.4; cursor:default}
button.ghost{background:none; border:1px solid var(--line);
  color:var(--muted); font-weight:600}
button.ghost:hover{border-color:var(--accent); color:var(--text)}
button:focus-visible,textarea:focus-visible,input:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px}

/* ---------- Start-Overlay ---------- */
#start{position:fixed; inset:0; background:rgba(10,11,13,.88);
  backdrop-filter:blur(4px); display:flex; align-items:center;
  justify-content:center; padding:16px; z-index:10}
.start-card{background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:22px; width:100%; max-width:520px;
  max-height:calc(100vh - 32px); overflow-y:auto}
.card-head{display:flex; align-items:baseline; gap:12px;
  justify-content:space-between; margin-bottom:4px}
.card-head .settings-link{margin-left:0}
.start-card h1{font-family:"IBM Plex Mono",monospace; font-size:15px;
  letter-spacing:.1em}
.start-card h1 b{color:var(--accent)}
.start-card p{color:var(--muted); font-size:13px; margin-bottom:16px}
.start-card label{display:block; font-family:"IBM Plex Mono",monospace;
  font-size:11px; letter-spacing:.08em; color:var(--muted);
  margin:12px 0 5px}
.start-card input,.start-card textarea,.start-card select{width:100%;
  background:var(--panel2); border:1px solid var(--line);
  border-radius:8px; color:var(--text); font:inherit; padding:9px 12px;
  outline:none}
.start-card textarea{height:110px; resize:vertical}
.start-card input:focus,.start-card textarea:focus,
.start-card select:focus{border-color:var(--accent)}
.chk{display:flex; align-items:center; gap:8px; margin-top:10px;
  font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  color:var(--muted); cursor:pointer}
.chk input{width:auto; accent-color:var(--accent)}
.ghstat{font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  color:var(--muted); margin-top:8px; min-height:16px}
.ghstat.bad{color:#E06060}
.req{color:var(--accent); letter-spacing:0}
.start-card button{margin-top:18px; width:100%; height:44px}
.start-card button.ghost{background:none; border:1px solid var(--line);
  color:var(--muted); margin-top:10px; height:38px}
.start-card button.ghost:hover{border-color:var(--accent); color:var(--text)}
.start-card .err{color:#E06060; font-size:12.5px; margin-top:8px;
  min-height:16px}
/* Preflight-Ergebnis als eigenes Fenster: die Meldungen sind lang, und
   vorher schoben sie Briefing und Knöpfe aus dem sichtbaren Bereich. */
#report{position:fixed; inset:0; background:rgba(10,11,13,.9);
  backdrop-filter:blur(4px); display:flex; align-items:center;
  justify-content:center; padding:16px; z-index:20}
/* Muss sein: display:flex oben schlaegt das hidden-Attribut, sonst steht
   das Fenster von Anfang an offen und laesst sich nicht schliessen. */
#report[hidden]{display:none}
.report-card{background:var(--panel); border:1px solid var(--line);
  border-radius:14px; width:100%; max-width:720px; max-height:85vh;
  display:flex; flex-direction:column; overflow:hidden}
.report-head{display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:14px 18px; border-bottom:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.14em}
.report-head button{height:32px; padding:0 14px; font-size:11.5px}
.report-body{padding:16px 18px; overflow-y:auto;
  font-family:"IBM Plex Mono",monospace; font-size:12px; line-height:1.75;
  overscroll-behavior:contain}
#check{font-family:"IBM Plex Mono",monospace}
#check .row{display:flex; gap:8px; align-items:baseline}
#check .row .state{flex:none; width:14px}
#check .ok{color:var(--muted)}
#check .bad{color:#E06060}
#check .hint{color:#E5A445; padding-left:22px}
#check .cat{color:var(--muted); padding-top:8px; word-break:break-all}

/* ---------- Mobile ---------- */
@media (max-width:760px){
  main{flex-direction:column}
  .rail{width:100%; display:flex; gap:2px; overflow-x:auto;
    padding:8px 10px; border-right:none;
    border-bottom:1px solid var(--line)}
  .rail h2{display:none}
  .member{flex:none; padding:4px 8px}
  .member .tag{display:none}
  .agenda{order:3; width:100%}
  /* Nebeneinander gibt es auf dem Handy nicht – untereinander mit
     Agentennamen ist immer noch besser als ein Chat-Mischmasch. */
  .cols{grid-template-columns:1fr}
  .col{max-height:none}
  .doc{padding:14px}
}
</style>
</head>
<body>

<header>
  <div class="wordmark">AGENT<b>WARS</b></div>
  <nav class="agenda" id="agenda" aria-label="Meeting-Agenda"></nav>
  <a class="settings-link" href="/usage">VERBRAUCH</a>
  <a class="settings-link" style="margin-left:14px" href="/settings">EINSTELLUNGEN</a>
</header>

<main>
  <aside class="rail" aria-label="Team">
    <h2>DEIN TEAM</h2>
    <div id="members"></div>
  </aside>

  <section class="chat-wrap">
    <div id="chat" aria-live="polite"></div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" placeholder="Sprich mit deinem Team … @name = sofortige Direktantwort"
          aria-label="Nachricht an das Team"></textarea>
        <button id="send">SENDEN</button>
      </div>
    </div>
  </section>
</main>

<div id="report" hidden>
  <div class="report-card">
    <div class="report-head">
      <span>PREFLIGHT</span>
      <button id="report-close" class="ghost" type="button">SCHLIESSEN</button>
    </div>
    <div class="report-body" id="check" aria-live="polite"></div>
  </div>
</div>

<div id="start">
  <div class="start-card">
    <div class="card-head">
      <h1>AGENT<b>WARS</b></h1>
      <!-- Muss hier stehen: das Overlay deckt den Header-Link ab, und beim
           ersten Aufruf ist ohne Einstellungen ohnehin nichts zu holen. -->
      <a class="settings-link" href="/settings">⚙ EINSTELLUNGEN</a>
    </div>
    <p>Sechs KI-Spezialisten. Ein Meeting. Dein Projekt auf dem Tisch.</p>

    <label for="project">PROJEKT</label>
    <select id="project"></select>

    <div id="pname-wrap" hidden>
      <label for="pname">PROJEKTNAME</label>
      <input id="pname" placeholder="Content Factory">
    </div>

    <label for="repo">GITHUB-REPO <span class="req">· Pflicht</span></label>
    <select id="repo"></select>
    <input id="reponew" placeholder="repo-name – wird privat angelegt" hidden>

    <label for="planeproj">PLANE-PROJEKT</label>
    <select id="planeproj"></select>

    <label for="coolifyapp">COOLIFY-ANWENDUNG</label>
    <select id="coolifyapp"></select>

    <div class="ghstat" id="ghstat"></div>

    <label for="brief">BRIEFING</label>
    <textarea id="brief" placeholder="Was ist das Projekt, für wen, was soll es erreichen – und was soll das Board besonders prüfen?"></textarea>
    <button id="go">MEETING STARTEN</button>
    <button id="probe" class="ghost" type="button">TEAM PRÜFEN</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script>
const state = { agents:{}, phases:[], msgs:{}, projects:[],
                repos:[], planeProjects:[], coolifyApps:[], planeError:"" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* marked und DOMPurify kommen vom CDN. Ist es nicht erreichbar – gesperrter
   Ausgang, Ausfall, Offline-Server – warf der erste Aufruf hier und riss das
   ganze Skript mit: keine Projektliste, kein Chat, keine Einstellungen.
   Ohne Markdown geht es zur Not auch, ohne Oberfläche nicht. */
const MARKDOWN = typeof marked !== "undefined" && typeof DOMPurify !== "undefined";
if (MARKDOWN) marked.setOptions({ breaks:true });

function md(text){
  let html = MARKDOWN
    ? DOMPurify.sanitize(marked.parse(text || ""))
    : "<p>" + esc(text).replace(/\n/g, "<br>") + "</p>";
  // @mentions einfärben (Agenten + DU)
  for (const id in state.agents){
    const a = state.agents[id];
    html = html.replace(new RegExp("@" + id + "\\b", "gi"),
      `<span class="mention" style="--m:${a.color}">@${a.name}</span>`);
  }
  return html;
}

/* ---------------- Team + Agenda laden ---------------- */
async function boot(){
  const res = await fetch("/api/team");
  if (res.status === 401){ location.reload(); return; }
  const data = await res.json();
  data.agents.forEach(a => state.agents[a.id] = a);
  state.phases = data.phases;

  $("members").innerHTML = data.agents.map(a => `
    <div class="member" id="member-${a.id}">
      <span class="dot" id="dot-${a.id}" style="background:${a.color};color:${a.color}"></span>
      <span class="who">
        <span class="name" style="color:${a.color}">${a.name}</span><br>
        <span class="tag">${a.tagline}</span>
      </span>
    </div>`).join("");

  $("agenda").innerHTML = state.phases.map(p => `
    <span class="agenda-item" id="phase-${p.id}">
      <span class="tick"></span>${p.label}
    </span>`).join("");

  data.agents.forEach(a => {
    $("member-" + a.id).onclick = () => {
      const inp = $("input");
      inp.value = (inp.value ? inp.value.trimEnd() + " " : "") + "@" + a.id + " ";
      inp.focus();
    };
  });

  if (data.running) $("start").style.display = "none";
  connect();
  await Promise.all([loadGithub(), loadPlane(), loadCoolify()]);
  await loadProjects();
}

/* ---------------- Projekt und seine Verknüpfungen ---------------- */
const NEU = "__NEU__";   // Sentinel für "neu anlegen" in den Dropdowns

function setGh(text, bad){
  $("ghstat").textContent = text;
  $("ghstat").className = "ghstat" + (bad ? " bad" : "");
}

function fillSelect(el, items, current, leer, neu){
  const options = [`<option value="">${esc(leer)}</option>`]
    .concat(items.map(i =>
      `<option value="${esc(i.value)}"${i.value === current ? " selected" : ""}>${esc(i.label)}</option>`));
  if (neu) options.push(`<option value="${NEU}">＋ ${esc(neu)}</option>`);
  el.innerHTML = options.join("");
  el.value = items.some(i => i.value === current) ? current : "";
}

async function loadGithub(){
  const res = await fetch("/api/github");
  if (!res.ok) return;
  const gh = await res.json();
  state.repos = gh.repos || [];
  if (gh.error){ setGh(gh.error, true); return; }
  setGh(gh.note
    ? `GitHub: ${gh.login} · ${gh.note}`
    : `GitHub: ${gh.login} · ${state.repos.length} Repos sichtbar`, !!gh.note);
}

async function loadPlane(){
  const res = await fetch("/api/plane/projects");
  if (!res.ok) return;
  const data = await res.json();
  state.planeProjects = data.projects || [];
  state.planeError = data.error || "";
}

async function loadCoolify(){
  const res = await fetch("/api/coolify/applications");
  const data = await res.json().catch(() => ({}));
  state.coolifyApps = data.applications || [];
}

async function loadProjects(){
  const res = await fetch("/api/projects");
  if (!res.ok) return;
  state.projects = (await res.json()).projects;
  $("project").innerHTML =
    state.projects.map(p =>
      `<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.repo_full_name || "—")}</option>`).join("")
    + '<option value="">＋ Neues Projekt</option>';
  if (!state.projects.length) $("project").value = "";
  syncProjectForm();
}

function syncProjectForm(){
  const p = state.projects.find(x => x.id === $("project").value);
  const neu = !p;

  $("pname-wrap").hidden = !neu;
  $("brief").value = p ? p.briefing : "";
  $("brief").placeholder = p
    ? "Optional: worauf soll das Board diesmal besonders schauen?"
    : "Was ist das Projekt, für wen, was soll es erreichen – und was soll das Board besonders prüfen?";

  // Das Repo ist der Anker des Projekts und wird nachträglich nicht getauscht.
  fillSelect($("repo"), state.repos.map(r => ({value:r.full_name, label:r.full_name})),
             p ? p.repo_full_name : "", "– Repo wählen –", neu ? "Neues Repo anlegen" : "");
  if (p) $("repo").innerHTML =
    `<option value="${esc(p.repo_full_name)}">${esc(p.repo_full_name)}</option>`;
  $("repo").disabled = !neu;
  $("reponew").hidden = true;

  fillSelect($("planeproj"),
             state.planeProjects.map(x => ({value:x.id, label:`${x.name} (${x.identifier})`})),
             p ? p.plane_project_id : "",
             state.planeError ? state.planeError : "– kein Plane-Projekt –",
             "Neues Plane-Projekt anlegen");
  fillSelect($("coolifyapp"),
             state.coolifyApps.map(a => ({value:a.uuid, label:a.name + (a.fqdn ? ` · ${a.fqdn}` : "")})),
             p ? p.coolify_app_uuid : "", "– keine Coolify-Anwendung –", "");
}

$("project").onchange = syncProjectForm;
$("repo").onchange = () => {
  $("reponew").hidden = $("repo").value !== NEU;
  if (!$("reponew").hidden) $("reponew").focus();
};

// Bei einem bestehenden Projekt wirken Plane und Coolify sofort.
async function linkExisting(feld, wert){
  const id = $("project").value;
  if (!id || wert === NEU) return;
  try{
    const data = await post("/api/projects/" + encodeURIComponent(id),
                            { [feld]: wert }, "PUT");
    const i = state.projects.findIndex(p => p.id === id);
    if (i >= 0) state.projects[i] = data.project;
    setGh("Verknüpfung gespeichert.");
  }catch(err){ setGh(err.message, true); }
}
$("planeproj").addEventListener("change", e => linkExisting("plane_project_id", e.target.value));
$("coolifyapp").addEventListener("change", e => linkExisting("coolify_app_uuid", e.target.value));

/* ---------------- WebSocket ---------------- */
let ws, sendQueue = [];
function connect(){
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onopen = () => { sendQueue.forEach(t => ws.send(t)); sendQueue = []; };
  ws.onclose = () => setTimeout(connect, 1500);
}

function scrollDown(){
  const c = $("chat");
  const nearBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 220;
  if (nearBottom) c.scrollTop = c.scrollHeight;
}

/* ---------------- Ansicht folgt der Phase ----------------
   Ein Gutachten, sechsmal gleichzeitig geschrieben, ist kein Chatbeitrag.
   Der Server sagt zu jeder Nachricht, welche Form sie bekommt: columns,
   chat oder doc. Chat schliesst einen offenen Block, Phasenwechsel auch. */
const PHASENTITEL = {
  gutachten: "PHASE 1 · EINZELBEITRÄGE",
  kreuzverhoer: "PHASE 2 · KREUZVERHÖR",
  synthese: "PHASE 3 · SYNTHESE"
};
let abschnitt = null;

function agentOf(id){
  return state.agents[id] || {name:id, color:"#888", tagline:""};
}

function agentKopf(a){
  return `<div class="head">
      <span class="name" style="color:${a.color}">${a.name}</span>
      <span class="role">${a.tagline}</span>
    </div>`;
}

function neuerAbschnitt(view, phase){
  const wrap = document.createElement("div");
  wrap.className = "section";
  const label = document.createElement("div");
  label.className = "section-label";
  label.textContent = PHASENTITEL[phase] ||
    (view === "doc" ? "DOKUMENT" : "BEITRÄGE");
  const inner = document.createElement("div");
  inner.className = view === "columns" ? "cols" : "docs";
  wrap.append(label, inner);
  $("chat").appendChild(wrap);
  return {view, phase, wrap, inner, spalten:{}};
}

function spalte(abs, agentId){
  if (abs.spalten[agentId]) return abs.spalten[agentId];
  const a = agentOf(agentId);
  const col = document.createElement("div");
  col.className = "col";
  col.style.setProperty("--agent", a.color);
  col.innerHTML = agentKopf(a) + '<div class="stack"></div>';
  abs.inner.appendChild(col);
  abs.spalten[agentId] = col.querySelector(".stack");
  return abs.spalten[agentId];
}

function dokument(abs, agentId){
  const a = agentOf(agentId);
  const art = document.createElement("article");
  art.className = "doc";
  art.style.setProperty("--agent", a.color);
  art.innerHTML = agentKopf(a);
  abs.inner.appendChild(art);
  return art;
}

function ziel(ev){
  const view = ev.view || "chat";
  if (view === "chat"){ abschnitt = null; return $("chat"); }
  if (!abschnitt || abschnitt.view !== view || abschnitt.phase !== ev.phase)
    abschnitt = neuerAbschnitt(view, ev.phase);
  return view === "columns" ? spalte(abschnitt, ev.agent)
                            : dokument(abschnitt, ev.agent);
}

/* Systemzeilen und Werkzeugmeldungen sollen bei dem stehen, worauf sie
   sich beziehen – in der Spalte des Agenten, sonst unter dem Block. */
function notizZiel(agentId){
  if (!abschnitt) return $("chat");
  if (abschnitt.view === "columns" && agentId && abschnitt.spalten[agentId])
    return abschnitt.spalten[agentId];
  return abschnitt.wrap;
}

function scrollInto(div){
  const stack = div && div.closest(".stack");
  if (!stack){ scrollDown(); return; }
  if (stack.scrollHeight - stack.scrollTop - stack.clientHeight < 160)
    stack.scrollTop = stack.scrollHeight;
}

/* ---------------- Events rendern ---------------- */
function handle(ev){
  if (ev.type === "phase"){
    abschnitt = null;   // neue Phase, neuer Block
    const el = $("phase-" + ev.phase);
    if (el){ el.classList.remove("active","done");
      if (ev.status === "active") el.classList.add("active");
      if (ev.status === "done") el.classList.add("done"); }
  }
  else if (ev.type === "agent_status"){
    const dot = $("dot-" + ev.agent);
    if (dot) dot.classList.toggle("typing", ev.status === "typing");
  }
  else if (ev.type === "msg_start"){
    // Nach einem Verbindungsabriss schickt der Server den Verlauf erneut –
    // ohne diese Bremse stünde jeder Beitrag zweimal da.
    if ($("m-" + ev.id)) return;
    const a = agentOf(ev.agent);
    const div = document.createElement("div");
    div.className = "msg"; div.id = "m-" + ev.id;
    div.style.setProperty("--agent", a.color);
    const kopf = (ev.view === "columns" || ev.view === "doc") ? "" : `
      <div class="head">
        <span class="name" style="color:${a.color}">${a.name}</span>
        <span class="role">${a.tagline}</span>
      </div>`;
    div.innerHTML = kopf + `
      <div class="body"><span class="stream"></span><span class="caret" style="--agent:${a.color};background:${a.color}"></span></div>`;
    ziel(ev).appendChild(div);
    state.msgs[ev.id] = "";
    scrollDown();
  }
  else if (ev.type === "token"){
    const div = $("m-" + ev.id);
    if (!div){ return; }
    state.msgs[ev.id] += ev.text;
    div.querySelector(".stream").textContent = state.msgs[ev.id];
    scrollInto(div);
  }
  else if (ev.type === "msg_reset"){
    // Fehlversuch: das halbe Fragment verwerfen, sonst klebt es vor der
    // Antwort des nächsten Anlaufs.
    const div = $("m-" + ev.id);
    state.msgs[ev.id] = "";
    if (div) div.querySelector(".stream").textContent = "";
  }
  else if (ev.type === "msg_end"){
    let div = $("m-" + ev.id);
    if (!div){
      // Nachricht kam aus der History (Reload) – Form mit übernehmen
      handle({type:"msg_start", id:ev.id, agent:ev.agent,
              view:ev.view, phase:ev.phase});
      div = $("m-" + ev.id);
    }
    div.querySelector(".caret")?.remove();
    div.querySelector(".stream").innerHTML = md(ev.text);
    delete state.msgs[ev.id];
    scrollInto(div);
  }
  else if (ev.type === "user_msg"){
    const div = document.createElement("div");
    div.className = "msg me";
    div.innerHTML = `
      <div class="head"><span class="name">DU</span>
      <span class="role">Gründer</span></div>
      <div class="body">${md(ev.text)}</div>`;
    $("chat").appendChild(div); scrollDown();
  }
  else if (ev.type === "meeting"){
    const div = document.createElement("div");
    div.className = "sys plane";
    div.textContent = `◆ Meeting eröffnet · ${ev.project}` +
      (ev.repo ? ` · ${ev.repo}` : "");
    $("chat").appendChild(div); scrollDown();
  }
  else if (ev.type === "tool"){
    const a = state.agents[ev.agent];
    const div = document.createElement("div");
    div.className = "sys tool";
    div.textContent = `⌁ ${a ? a.name : ev.agent}: ${ev.text}`;
    if (a) div.style.color = a.color;
    notizZiel(ev.agent).appendChild(div); scrollInto(div);
  }
  else if (ev.type === "system" || ev.type === "plane"){
    const div = document.createElement("div");
    const warn = ev.type === "system" && /warnung|fehler|fällt aus|fallen/i.test(ev.text);
    div.className = "sys" + (ev.type === "plane" ? " plane" : warn ? " warn" : "");
    div.textContent = (ev.type === "plane" ? "◆ " : "· ") + ev.text;
    notizZiel("").appendChild(div); scrollDown();
  }
}

/* ---------------- Senden ---------------- */
function sendMsg(){
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  if (ws && ws.readyState === 1) ws.send(text); else sendQueue.push(text);
}
$("send").onclick = sendMsg;
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMsg(); }
});

/* ---------------- Preflight: wer antwortet überhaupt? ---------------- */
function zeigeReport(){ $("report").hidden = false; }
function schliesseReport(){ $("report").hidden = true; }
$("report-close").onclick = schliesseReport;
$("report").onclick = e => { if (e.target === $("report")) schliesseReport(); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("report").hidden) schliesseReport();
});

$("probe").onclick = async () => {
  $("probe").disabled = true;
  zeigeReport();
  $("check").innerHTML = '<div class="ok">Prüfe Modelle …</div>';
  try{
    const res = await fetch("/api/preflight");
    if (res.status === 401){ location.reload(); return; }
    const data = await res.json();
    const rows = data.agents.map(a => `
      <div class="row ${a.ok ? "ok" : "bad"}">
        <span class="state">${a.ok ? "✓" : "✕"}</span>
        <span>${esc(a.name)} · ${esc(a.model)} — ${esc(a.detail)}</span>
      </div>` + (a.hint ? `<div class="hint">↳ ${esc(a.hint)}</div>` : "")
    ).join("");
    const catalog = data.router_error
      ? `<div class="cat">Router-Katalog: ${esc(data.router_error)}</div>`
      : (data.router_models.length
          ? `<div class="cat">Router: ${data.router_models.length} Chat-Modelle
             von ${data.router_total} Eintr\u00e4gen. Vollst\u00e4ndige Auswahl unter
             <a href="/settings" style="color:inherit">Einstellungen</a>.</div>`
          : "");
    $("check").innerHTML = rows + catalog;
  }catch(err){
    $("check").innerHTML = `<div class="bad">Preflight fehlgeschlagen: ${esc(err.message)}</div>`;
  }finally{
    $("probe").disabled = false;
  }
};

/* ---------------- Meeting starten ---------------- */
async function post(url, body, method){
  const res = await fetch(url, {
    method: method || "POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  if (res.status === 401){ location.reload(); throw new Error("Session abgelaufen"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Anfrage fehlgeschlagen");
  return data;
}

$("go").onclick = async () => {
  $("err").textContent = "";
  $("go").disabled = true;
  try{
    let projectId = $("project").value;
    if (!projectId){
      // Neues Projekt: erst Repo, Plane und Coolify klären, dann das Meeting.
      const neuesRepo = $("repo").value === NEU;
      const created = await post("/api/projects", {
        name: $("pname").value,
        briefing: $("brief").value,
        repo_full_name: neuesRepo ? $("reponew").value.trim() : $("repo").value,
        create_repo: neuesRepo,
        plane_project_id: $("planeproj").value === NEU ? "" : $("planeproj").value,
        create_plane_project: $("planeproj").value === NEU,
        coolify_app_uuid: $("coolifyapp").value
      });
      projectId = created.project.id;
      await loadProjects();
      $("project").value = projectId;
      syncProjectForm();
    }
    await post("/api/start", { project_id: projectId,
                               briefing: $("brief").value });
    $("start").style.display = "none";
  }catch(err){
    $("err").textContent = err.message;
  }finally{
    $("go").disabled = false;
  }
};

boot();
