services:
  boardroom:
    build: .
    # Kein Host-Port: In Coolify routet Traefik intern auf diesen Port.
    # Ein "ports:"-Mapping würde 8000 auf dem Server belegen und mit allem
    # kollidieren, was dort schon läuft. Für lokal siehe compose.override.
    expose:
      - "8000"
    env_file: .env
    environment:
      # Coolify-Magie: sagt Traefik ausdrücklich, dass die Domain dieses
      # Dienstes auf Port 8000 routet. Ohne das muss Coolify den Port raten
      # und die Domain landet auf der Fallback-Seite. Der Wert kommt von
      # Coolify selbst – hier steht bewusst nur der Name.
      - SERVICE_FQDN_BOARDROOM_8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      # Projekte, Meetings und der komplette Verlauf liegen hier.
      # Ohne dieses Volume ist nach jedem Redeploy alles weg.
      - agentwars-data:/data

  # Optional: TencentDB Agent Memory (Team-Gedächtnis, MIT-Lizenz)
  # Setup & aktuelle Image-Namen: https://github.com/TencentCloud/TencentDB-Agent-Memory
  # Danach in der .env MEMORY_PROXY_BASE_URL auf den Memory-Proxy zeigen lassen –
  # die HostYourAI-Agenten laufen dann automatisch durch das Gedächtnis.

volumes:
  agentwars-data:
